name: Check portfolio project pages
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/portfolio-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-previews
          path: outputs/portfolio-previews/
